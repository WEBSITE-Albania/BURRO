<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BURRO – Italian Bakery · Tiranë</title>
  <meta name="description" content="BURRO – Italian Bakery në Tiranë. Klasikët italianë & viennoiserie, bërë siç duhet. Shikoni menunë, na vlerësoni në Google dhe na ndiqni në Instagram.">
  <meta name="theme-color" content="#1B532C">

  <meta property="og:title" content="BURRO – Italian Bakery">
  <meta property="og:description" content="Klasikët italianë & viennoiserie, bërë siç duhet.">
  <meta property="og:image" content="images/burro_logo.png">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/png" href="images/burro_logo.png">
  <link rel="apple-touch-icon" href="images/burro_logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Fraunces:ital,opsz,wght@1,9..144,400&family=Jost:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Italian awning strip -->
  <div class="awning" aria-hidden="true"></div>

  <!-- Decorative hand-drawn illustrations (purely visual) -->
  <div class="doodles" aria-hidden="true">
    <!-- Croissant -->
    <svg class="doodle doodle--croissant" viewBox="0 0 120 80">
      <path d="M8 48C14 34 26 26 38 24c8-10 36-10 44 0 12 2 24 10 30 24-8 6-18 4-24-2-4 12-16 18-28 18s-24-6-28-18c-6 6-16 8-24 2Z"/>
      <path d="M38 24c4 8 4 16-6 22M82 24c-4 8-4 16 6 22M50 18c4 12 4 28 0 44M70 18c-4 12-4 28 0 44"/>
    </svg>

    <!-- Rustic loaf -->
    <svg class="doodle doodle--loaf" viewBox="0 0 120 80">
      <path d="M12 62c-2-26 22-46 48-46s50 20 48 46c-30 5-66 5-96 0Z"/>
      <path d="M34 30c4 6 7 12 8 18M54 24c4 6 7 13 8 20M74 26c4 6 7 12 8 18"/>
      <path d="M8 68c34 5 70 5 104 0"/>
    </svg>

    <!-- Cinnamon roll -->
    <svg class="doodle doodle--roll" viewBox="0 0 100 100">
      <path d="M50 50a3 3 0 0 1 6 0a6 6 0 0 1-12 0a9 9 0 0 1 18 0a12 12 0 0 1-24 0a15 15 0 0 1 30 0a18 18 0 0 1-36 0a21 21 0 0 1 42 0"/>
      <path d="M26 66c6 12 18 18 26 18s20-6 26-18"/>
    </svg>

    <!-- Wheat sprig -->
    <svg class="doodle doodle--wheat" viewBox="0 0 60 120">
      <path d="M30 116C30 80 31 50 32 14"/>
      <path d="M32 18c-6-4-8-10-6-16 6 3 8 9 6 16ZM32 18c6-4 8-10 6-16-6 3-8 9-6 16Z"/>
      <path d="M31 36c-8-3-12-10-10-17 8 3 11 10 10 17ZM31 36c8-3 12-10 10-17-8 3-11 10-10 17Z"/>
      <path d="M31 56c-8-3-12-10-10-17 8 3 11 10 10 17ZM31 56c8-3 12-10 10-17-8 3-11 10-10 17Z"/>
      <path d="M30 76c-8-3-12-10-10-17 8 3 11 10 10 17ZM30 76c8-3 12-10 10-17-8 3-11 10-10 17Z"/>
    </svg>

    <!-- Espresso cup -->
    <svg class="doodle doodle--cup" viewBox="0 0 100 90">
      <path d="M24 40h44v10c0 14-10 24-22 24S24 64 24 50Z"/>
      <path d="M68 46c8 0 12 4 12 9s-5 9-13 8"/>
      <path d="M14 78c22 6 50 6 72 0"/>
      <path d="M38 32c-4-5 4-9 0-14M48 30c-4-5 4-9 0-14M58 32c-4-5 4-9 0-14"/>
    </svg>
  </div>

  <main class="page">

    <!-- Brand -->
    <header class="brand">
      <img class="brand__logo" src="images/burro_logo.png" alt="Logo e BURRO – Italian Bakery" width="108" height="108">
      <p class="brand__kicker">Italian Bakery</p>
      <h1 class="brand__name">BURRO</h1>
      <p class="brand__slogan">Klasikët italianë &amp; viennoiserie, bërë siç duhet</p>
    </header>

    <div class="ornament" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 24 12"><path d="M2 10C5 3 9 2 12 2s7 1 10 8c-3 1-5 0-6-2-1 3-3 3-4 3s-3 0-4-3c-1 2-3 3-6 2Z"/></svg>
      <span></span>
    </div>

    <!-- Actions -->
    <nav class="actions" aria-label="Lidhjet kryesore">

      <!-- MENU LINK: to switch to a PDF later, change only this href (e.g. "menu/burro_menu.pdf") -->
      <a class="btn btn--menu" href="images/menu.pdf" type="application/pdf" target="_blank" rel="noopener">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 5.5C6.5 4.3 9.3 4.3 12 6c2.7-1.7 5.5-1.7 8-.5V19c-2.5-1.2-5.3-1.2-8 .5-2.7-1.7-5.5-1.7-8-.5Z"/>
            <path d="M12 6v13.5"/>
          </svg>
        </span>
        <span class="btn__label">Shikoni menunë</span>
        <span class="btn__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="btn btn--google" href="https://search.google.com/local/writereview?placeid=ChIJY7b7oIUxUBMR4Y_VRHJJSDA" target="_blank" rel="noopener">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="star-icon">
            <path d="M12 3.2l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.6l-5.3 2.9 1.1-5.9-4.4-4.1 6-.8Z"/>
          </svg>
        </span>
        <span class="btn__label">
          Na vlerësoni në Google
          <span class="stars" aria-hidden="true">
            <svg viewBox="0 0 100 18"><g><path id="s" d="M9 1.5l2.3 4.8 5.2.7-3.8 3.6.9 5.2L9 13.3 4.4 15.8l.9-5.2L1.5 7l5.2-.7Z"/><use href="#s" x="20.5"/><use href="#s" x="41"/><use href="#s" x="61.5"/><use href="#s" x="82"/></g></svg>
          </span>
        </span>
        <span class="btn__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

      <a class="btn btn--insta" href="https://www.instagram.com/burro.albania/" target="_blank" rel="noopener">
        <span class="btn__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5.2"/>
            <circle cx="12" cy="12" r="4.2"/>
            <circle cx="17.4" cy="6.6" r="1.1" class="dot"/>
          </svg>
        </span>
        <span class="btn__label">Na ndiqni në Instagram</span>
        <span class="btn__arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
      </a>

    </nav>

    <!-- Location -->
    <p class="location">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      Tiranë, Shqipëri
    </p>

  </main>

  <footer class="signature">
    Krijuar me kujdes për BURRO nga Preiz Co.
  </footer>

</body>
</html>
